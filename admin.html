<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0b"><title>BETORA — администрация</title><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body><div class="app-shell"><header class="topbar"><a class="brand compact" href="/admin.html"><img src="/assets/logo.png" alt="BETORA"><span>BETORA <small>ADMIN</small></span></a><div class="user-tools"><span class="admin-label"><i class="fa-solid fa-shield-halved"></i> Панель администратора</span><button id="logout" class="icon-button" title="Выйти"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>
<nav class="main-tabs admin-tabs"><button class="active" data-admin-view="users">Пользователи</button><button data-admin-view="withdrawals">Заявки на вывод <b id="pending-count" class="count-badge">0</b></button><button data-admin-view="bets">Ставки</button><button data-admin-view="matches">Матчи и коэффициенты</button><button data-admin-view="transactions">Журнал</button></nav>
<main class="content">
<section class="admin-view" id="admin-users"><div class="section-heading"><div><p class="eyebrow">УПРАВЛЕНИЕ АККАУНТАМИ</p><h1>Пользователи</h1></div><input id="user-search" class="search-input" placeholder="Поиск по нику или логину"></div><div id="users-table" class="table-wrap"></div></section>
<section class="admin-view hidden" id="admin-withdrawals"><div class="section-heading"><div><p class="eyebrow">ЗАЯВКИ ИГРОКОВ</p><h1>Заявки на вывод</h1></div><select id="withdraw-filter"><option value="pending">Ожидают</option><option value="done">Выполненные</option></select></div><div id="withdrawals-table" class="table-wrap"></div></section>
<section class="admin-view hidden" id="admin-bets"><div class="section-heading"><div><p class="eyebrow">РАСЧЁТ СТАВОК</p><h1>Ставки игроков</h1></div></div><div id="admin-bets-table" class="table-wrap"></div></section>
<section class="admin-view hidden" id="admin-matches"><div class="section-heading"><div><p class="eyebrow">СПОРТИВНАЯ ЛИНИЯ</p><h1>Матчи и коэффициенты</h1></div><button id="new-match" class="gold-button"><i class="fa-solid fa-plus"></i> Добавить матч</button></div><div id="matches-table" class="table-wrap"></div></section>
<section class="admin-view hidden" id="admin-transactions"><div class="section-heading"><div><p class="eyebrow">АУДИТ БАЛАНСА</p><h1>Журнал операций</h1></div></div><div id="admin-transactions-table" class="table-wrap"></div></section>
</main><footer class="site-footer">Игровая валюта АР. Ставки не настоящие. Проект для Minecraft.</footer></div>
<div id="admin-modal" class="modal"><div class="modal-card wide"><button class="modal-close" data-close="admin-modal"><i class="fa-solid fa-xmark"></i></button><h2 id="admin-modal-title">Изменение</h2><form id="admin-modal-form" class="form-stack"></form></div></div><div id="toast-root" class="toast-root"></div><script src="/assets/js/common.js"></script><script src="/assets/js/admin.js"></script></body></html>
